[package]
name = "mosaic-notes"
version = "1.0.0"
edition = "2021"

[workspace]
members = ["src-tauri"]

[dependencies]
leptos = { version = "0.6", features = ["csr"] }
console_error_panic_hook = "0.1"
gloo-storage = "0.3"
gloo-timers = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "Window", "Document", "HtmlElement", "HtmlInputElement",
  "HtmlTextAreaElement", "Element", "KeyboardEvent", "DomTokenList"
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
